function historicalAttackScene(h){
 const battle=h.battle||'領国をめぐる戦い';
 const attackers={
  '大内家':'毛利軍は周防・長門へ進軍した。大内方の抵抗が続き、戦況は予断を許さない。',
  '斎藤家':'織田軍が稲葉山城に迫る。堅城を前に、諸将は攻め方を議論している。',
  '六角家':'織田軍は近江へ進軍した。六角勢の動向を探りながら進路を定めている。',
  '今川家':'徳川軍は掛川城を包囲した。今川方の抵抗と和議の噂が交錯している。',
  '波多野家':'明智光秀の軍勢が八上城を包囲する。城内の動きはつかめず、長い攻防が続いている。',
  '武田家':'織田・徳川の連合軍が甲斐へ進軍する。武田軍も各地で迎撃の構えを見せている。',
  '朝倉家':'織田軍が越前へ進軍した。朝倉勢は守りを固め、各地で戦の気配が高まる。',
  '浅井家':'織田軍は小谷城へ迫った。浅井勢も守備を固め、山城をめぐる戦いが始まろうとしている。'
 };
 const intro='【攻城・進軍】'+battle+'\n'+(attackers[h.clan]||h.clan+'との戦が迫り、諸将は攻め方を評議している。')+'\n\nあなたは'+s.clan+'の'+s.rank+'として、この戦に加わっている。\n'+P(attackingForeboding)+'\nあなたはどう行動するか。';
 const fight=(action)=>()=>{
  s.pendingAttackFalls=(s.pendingAttackFalls||[]).filter(c=>c!==h.clan);
  const stat=action==='charge'?'武勇':action==='strategy'?'知略':'魅力';
  const chance=Math.max(12,Math.min(92,35+Math.floor((s.stats[stat]||0)*.55)));
  const success=R(1,100)<=chance;
  const danger=action==='charge'?12:action==='strategy'?7:3;
  if(risk(danger+(s.age>=70?6:0)+(s.stats.健康<30?5:0),battle+'で討死した。')){announceHistoricalFall(h);return '【討死】'+battle+'の戦場で命を落とした。\n【史実の結末】'+h.story;}
  if(success){s.merit=(s.merit||0)+(action==='rescue'?1:2);s.trust=(s.trust||0)+2;mod(stat,R(1,3));}
  else {mod('健康',-R(2,7));if(action==='charge')mod('財産',-R(1,3));}
  announceHistoricalFall(h);
  const actionText=action==='charge'?'前線で槍を振るい':action==='strategy'?'敵の動きを読み、味方を導き':'負傷者を助け、味方の退路を守り';
  return (success?'【成功】':'【苦戦】')+actionText+(success?'、任務を果たした。':'、傷を負いながら戦場を離れた。')+'\n\n【戦の結末】'+h.story;
 };
 return scene(battle,intro,[
  opt('先陣に立って攻める','武勇／討死の危険・武功',fight('charge')),
  opt('戦況を読み、部隊を指揮する','知略／討死の危険・武功',fight('strategy')),
  opt('負傷者と味方の退路を守る','魅力／危険は比較的低い',fight('rescue'))
 ]);
}
const nationalEventSeen=()=>{if(!s.nationalEventSeen||typeof s.nationalEventSeen!=='object')s.nationalEventSeen={};return s.nationalEventSeen};

 }

// 関ヶ原：大名家の史実上の陣営を基本とし、架空の主人公の手勢だけは離反できる。

function sekigaharaDefaultSide(){
 const west=['毛利家','島津家','上杉家','豊臣家','長宗我部家'];

}
function sekigaharaScene(h,prefix){
 const originalClan=militaryAllegiance();
 const vassalDaimyo=s.rank==='大名'&&!s.independent&&!!s.overlord;
 const freeDaimyo=s.rank==='大名'&&s.independent;
 const defaultSide=sekigaharaDefaultSide(),otherSide=defaultSide==='東軍'?'西軍':'東軍';
 const canJoinTokugawa=['毛利家','島津家','上杉家','豊臣家','長宗我部家'].includes(originalClan)
   &&!!originalClan&&s.rank!=='大名'&&s.rank!=='浪人';
 const son=heirForSuccession(),hasSon=!!(son&&son.alive!==false);
 const inherited=!!(s.successionMode&&hasSon),regent=s.successionMode==='regent';
 const campName=side=>side==='東軍'?'徳川家康の東軍':'石田三成らの西軍';
 const record=(side,defected)=>{
  s.sekigaharaSide=side;
  if(side==='西軍'&&s.age>=55&&['家臣','重臣','家中筆頭','大名'].includes(s.rank))s.oldWarriorOath=true;

  else note('関ヶ原では'+side+'として戦った。');
 };
 const transferToTokugawa=()=>{
  if(!canJoinTokugawa||s.clan!=='徳川家'&&s.clan!==originalClan)return '';

  const old=s.clan;
  s.previousService={clan:old,rank:s.rank,year:birthYear()+s.age,reason:'関ヶ原で東軍に離反'};
  s.clan='徳川家';
  s.local='徳川家';
  s.trust=2;
  if(s.housePower&&s.housePower.clan===old)s.housePower=null;
  if(!Array.isArray(s.achievements))s.achievements=[];
  s.achievements.push({age:s.age,year:birthYear()+s.age,kind:'離反・仕官',summary:old+'から離反し、関ヶ原で徳川家に仕えた'});
  note('関ヶ原で'+old+'を離れ、手勢とともに徳川家の家臣となった。');
  return '【主家離反】'+old+'を離れ、あなたの家は徳川家の家臣となった。以後は徳川家に仕える。\n';
 };
 const sonFight=(side,defected)=>{
  const transferred=side==='東軍'&&canJoinTokugawa?transferToTokugawa():'';
  record(side,defected);
  const pre=defected?'主家の軍勢とは袂を分かち、'+campName(side)+'へ手勢を率いて加わった。\n':'';
  if(R(1,100)<=5){
   son.alive=false;s.heirSon=son;note(son.name+'が関ヶ原の戦いで討死した。');
   return transferred+pre+'【悲報】'+son.name+'は関ヶ原の戦場で討死した。\n【史実の結末】'+h.body;
  }
  return transferred+pre+son.name+'は'+campName(side)+'として戦い、帰還した。'+(side==='西軍'?'西軍の敗戦を受け、戦後の処遇には不安が残る。':'東軍の勝利を受け、家中は安堵した。')+'\n【史実の結末】'+h.body;
 };
 const protagonistFight=(side,defected)=>{
  const transferred=side==='東軍'&&canJoinTokugawa?transferToTokugawa():'';
  record(side,defected);
  const out=historicalCombat(h,side,'strategy','野戦');
  return transferred+(defected?'主家の陣営に背き、自らの手勢を率いて'+campName(side)+'に加わった。\n':'')+out;
 };
 const intro=prefix+(freeDaimyo?'あなたは独立大名として自らの軍勢を率いる。東軍と西軍、どちらに加わるかはあなたの決断に委ねられている。':vassalDaimyo?'あなたの従属先である'+originalClan+'は'+defaultSide+'の陣営にある。主従関係に従い、その陣営で戦う。':'あなたの仕える'+(originalClan||'勢力')+'は'+defaultSide+'の陣営にある。')+
  (canJoinTokugawa?'ただし、主家に背き、自分たちだけで徳川家に仕える道もある。':vassalDaimyo?'主君の軍勢と行動をともにする。':freeDaimyo?'どちらの陣営に加わるかは自由である。':'自らの手勢の進退を決めることになる。')+
  (inherited?'\n家督を継いだ'+son.name+'が判断を迫られている。'+(regent?'実権を握るあなたは息子に命令できる。':'完全隠居したあなたは助言できるが、最終的には息子が決める。'):vassalDaimyo?'\nあなた自身が主家の陣営で出陣する。':'\nあなた自身が出陣する陣営を決める。')+'\n\nあなたはどうするか。';
 const make=(side,defected)=>{
  const switchLord=side==='東軍'&&canJoinTokugawa;
  const label=(inherited?(regent?'息子に命じて':'息子に勧めて'):'自ら')+(switchLord?'主家を離れ徳川家に仕える':side+'につく');
  const desc=(switchLord?'徳川家へ仕官先変更／':defected?'主家の方針に背く／':'')+(inherited?'息子に討死の危険':'自分に討死の危険');
  return opt(label,desc,()=>{
   if(!inherited)return protagonistFight(side,defected);
   if(regent)return 'あなたの命を受け、'+sonFight(side,defected);
   // 完全隠居では助言に強制力はなく、拒まれれば元の主家に留まる。
   const chosen=R(1,100)<=70?side:defaultSide;
   return chosen===side?'息子はあなたの助言を受け入れた。\n'+sonFight(chosen,chosen!==defaultSide):
     '息子は助言を聞いたが、自らの考えで'+chosen+'につくと決めた。\n'+sonFight(chosen,false);
  });
 };
 const options=vassalDaimyo?[make(defaultSide,false)]:freeDaimyo?[make('東軍',false),make('西軍',false)]:[make(defaultSide,false),make(otherSide,true)];

  options.push(opt(regent?'息子の判断に任せる':'助言せず息子に任せる','息子が出陣する／討死の危険',()=>{
   return '息子は'+defaultSide+'につくと決めた。\n'+sonFight(defaultSide,false);
  }));
 }else if(!vassalDaimyo){
  options.push(opt('どちらにも加わらず戦を避ける','出陣しない／信頼に影響',()=>{
   s.sekigaharaSide='中立';s.trust=Math.max(0,(s.trust||0)-R(2,5));
   return 'あなたは自らの手勢を戦場へ送らず、情勢を見守った。\n【史実の結末】'+h.body;
  }));
 }

}

function exceptionalHeadFeat(){
 if(!s.clan||!['足軽','足軽大将'].includes(s.rank))return '';
 const rate=Math.min(12,3+Math.floor((s.stats.武勇||0)/25)+(s.rank==='足軽大将'?2:0));
 if(R(1,100)>rate)return '';
 const oldRank=s.rank;
 s.rank='家臣';
 s.merit=(s.merit||0)+8;
 s.trust=(s.trust||0)+12;
 mod('魅力',R(2,5));
 mod('財産',R(4,9));
 note('合戦で敵方の有力な部隊長を討ち取り、大将首の大手柄により'+oldRank+'から家臣へ一挙に取り立てられた。');
 return '【大将首の大手柄】敵方の有力な部隊長を討ち取った！主君は異例の武功を賞し、あなたを'+oldRank+'から一挙に家臣へ取り立てた。';
}
function historicalCombat(h,side,action,battleType){
 const relatedFall=historicalFalls.find(f=>f.year===h.year&&fallHistoryBattle(f)===h.id);
 // The defending house has its own defeat scene and milestone. Other participants learn the outcome after choosing.
 const notifyAfterCombat=()=>{if(relatedFall&&s.clan!==relatedFall.clan)announceHistoricalFall(relatedFall)};
 const winner=h.kind==='sekigahara'?'東軍':h.kind==='osaka'?'徳川方':h.winner;
 const friendlyWin=side===winner||side==='勝利側'||(h.kind==='osaka'&&side==='徳川方');
 const stat=action==='charge'?'武勇':action==='strategy'?'知略':'魅力';
 const chance=Math.max(12,Math.min(92,35+Math.floor((s.stats[stat]||0)*.55)));
 const success=R(1,100)<=chance;
 const danger=(action==='charge'?12:action==='strategy'?7:3)+(friendlyWin?0:5)+(s.age>=70?6:0)+(s.stats.健康<30?5:0);
 if(risk(danger,h.title+'で討死した。')){notifyAfterCombat();return '【討死】'+h.title+'の戦場で敵の攻撃を受け、命を落とした。\n【史実の結末】'+h.body;}
 let greatFeat='';if(success){if(s.clan){s.merit=(s.merit||0)+(action==='rescue'?1:2);s.trust=(s.trust||0)+2;}mod(stat,R(1,3));if(action==='charge')greatFeat=exceptionalHeadFeat();}
 else{mod('健康',-R(2,7));if(action==='charge')mod('財産',-R(1,3));}
 const actionText=action==='charge'?'前線で槍を振るい':action==='strategy'?'敵の動きを読み、味方を導き':'混乱する兵と負傷者を助け';
 notifyAfterCombat();
 const end='【史実の結末】'+h.body;
 return (success?'【成功】':'【苦戦】')+actionText+(success?'、任務を果たした。':'、傷を負いながら戦場を離れた。')+'\n'+(friendlyWin?(h.id==='komaki'?'長久手では徳川方が勝利したが、戦役は講和に向かった。':'味方は勝利した。'):side==='中立'?'両軍の戦いを見届けた。':'味方は敗れ、退却を余儀なくされた。')+'\n'+(greatFeat?greatFeat+'\n':'')+end;
}

const historicalSuccessor=(clan,year)=>{

  const h=historicalFalls.find(x=>x.clan===current&&year>=x.year);
  if(!h)break;
  current=h.successor;
 }
 return current;
};
// Ver.6.3: 過去の最高役職と、謀反失敗による仕官禁止の履歴を保持する。
const militaryRankOrder=['足軽','足軽大将','家臣','重臣','家中筆頭','大名'];
function rememberHighestRank(rank){
 if(!s)return;
 const current=militaryRankOrder.indexOf(rank);
 if(current<0)return;
 if(current>militaryRankOrder.indexOf(s.highestMilitaryRank||''))s.highestMilitaryRank=rank;

function markFailedRebellion(clan,reason,rank){
 if(!clan)return;
 rememberHighestRank(rank);
 if(!Array.isArray(s.failedRebellions))s.failedRebellions=[];
 const year=birthYear()+s.age;
 s.failedRebellions.push({clan,year,reason,rank:rank||s.highestMilitaryRank||'足軽'});
 if(!Array.isArray(s.achievements))s.achievements=[];
 s.achievements.push({age:s.age,year,kind:'謀反失敗',summary:clan+'への'+reason+'に失敗し、主家を追われた'});
 note(clan+'への'+reason+'に失敗。以後、この主家への再仕官は認められない。');
}
function isBannedService(clan){
 const year=birthYear()+s.age;
 const target=renamedClan(clan,year);
 return (s.failedRebellions||[]).some(x=>renamedClan(x.clan,year)===target&&!fallenHouse(target,year));
}
function availableServiceClans(){

function rankForReemployment(){
 const former=s.highestMilitaryRank||(s.previousService&&s.previousService.rank)||'足軽';
 const order=militaryRankOrder.indexOf(former);
 const notorious=(s.failedRebellions||[]).length>0;
 if(order<=0)return '足軽';
 if(order===1)return R(1,100)<=(notorious?30:65)?'足軽大将':'足軽';
 if(order===2)return R(1,100)<=(notorious?25:65)?'家臣':'足軽大将';
 // 元重臣・家中筆頭も、他家では一段低い役目からの再起が多い。

function applyHistoricalFalls(showNews){
 if(!s)return;
 const year=birthYear()+s.age;
 if(!s.historicalFallsSeen||typeof s.historicalFallsSeen!=='object')s.historicalFallsSeen={};
 for(const h of historicalFalls){
  if(year<h.year||s.historicalFallsSeen[h.clan])continue;
  // 赤松家の戦後処分は、同年の関ヶ原の戦いが終わってから発生させる。
  if(h.clan==='赤松家'&&year===1600&&!nationalEventSeen().sekigahara)continue;
  s.historicalFallsSeen[h.clan]=true;
  if(s.rank==='大名'&&!s.independent&&s.overlord===h.clan){
   s.independent=true;s.overlord=null;s.trust=0;
   note(h.clan+'が滅亡したため、主従関係が解消され、独立大名となった。');
   if(showNews)queueMilestone('主家滅亡 ― 独立大名へ',h.clan+'が大名家としての地位を失った。あなたは自領と家臣を保ち、独立大名として歩むこととなった。');
  }
  const attacker=showNews&&year===h.year&&h.type==='battle'&&!attackHistoryCovered(h)&&
   (fallAttackers[h.clan]||[]).includes(s.clan);
  if(attacker){
   if(!Array.isArray(s.pendingAttackFalls))s.pendingAttackFalls=[];
   if(!s.pendingAttackFalls.includes(h.clan))s.pendingAttackFalls.push(h.clan);
  }
  const serving=s.clan===h.clan&&s.rank!=='大名';
  if(s.local===h.clan)s.local=historicalSuccessor(h.clan,year);
  // すでに滅亡した大名家からの勧誘予約は破棄する。
  if(s.foreignInvitationPending===h.clan)s.foreignInvitationPending=null;
  if(serving&&showNews&&year===h.year&&s.alive){
   s.pendingHistoricalFall=h.clan;
   note(h.year+'年、'+(h.battle||'家中の変事')+'。主家の命運をかけた事態に直面した。');
  }else if(serving){
   // 旧セーブを過去の年から読み込んだ場合も滅亡済みの家には残れない。
   s.previousService={clan:h.clan,rank:s.rank,year,reason:'主家滅亡'};s.clan=null;s.rank='浪人';s.trust=0;s.pendingBattle=false;
   note(h.title+'。主家を失い浪人となった。');
   if(showNews)queueMilestone('主家滅亡 ― 浪人となる',h.story+'\nあなたは主家を失い、浪人となった。');
  }else if(showNews&&year===h.year&&!attacker){
   const battleId=fallHistoryBattle(h);
   const nationalParticipant=battleId==='osaka_summer'||(battleId&&nationalHistory.some(x=>x.id===battleId&&x.clans&&x.clans.includes(s.clan)));
   if(!nationalParticipant){
    announceHistoricalFall(h);
    // This is the same national event: don't also show a redundant generic war bulletin.
    if(battleId)nationalEventSeen()[battleId]=true;
   }
  }
 }
 // 過去年のセーブや旧バージョンで既に滅んだ勢力を再び所属先にしない。
 if(s.local&&fallenHouse(s.local,year))s.local=historicalSuccessor(s.local,year);
}

function child(){
 if(s.age<=5){
  if(R(1,100)<=(s.body==='病弱'?24:8))return scene('幼い日の病','熱が続き、家族はあなたの身を案じている。',[opt('家の蓄えを使って手当てを受ける','財産－6／健康回復の機会',()=>{mod('財産',-6);return risk(s.body==='病弱'?13:3,'幼い日の病で亡くなった。')?'家族の看病もむなしく、病に倒れた。':change({健康:R(2,7)},'熱が下がり、回復へ向かった。')},()=>s.stats.財産>=6),opt('家で静養する','健康低下の可能性',()=>risk(s.body==='病弱'?25:7,'幼い日の病で亡くなった。')?'病に勝てなかった。':change({健康:-R(3,9)},'しばらく寝込んだが、命は取り留めた。'))]);
  const infantMoments=['家族に抱かれて初めて笑った。','初めて自分の足で歩いた。','家の庭先で草花に触れた。','初めて言葉を覚え、家族を喜ばせた。','近所の子の遊びを眺めた。','父母の働く姿を見て過ごした。','初めての祭りで太鼓の音に驚いた。','雨音を聞きながら家族と過ごした。','初めての雪に手を伸ばした。','庭に来た小鳥を追いかけた。'];
  if(!s.childhoodSeen)s.childhoodSeen=[];
  let unseen=infantMoments.filter(x=>!s.childhoodSeen.includes(x));let moment=P(unseen.length?unseen:infantMoments);s.childhoodSeen.push(moment);
  return {title:'幼い日々',text:moment,options:[],autoInfant:true};
 }
 if(!s.childhoodSeen)s.childhoodSeen=[];
 // 幼少期は各イベントを原則一生に一度だけ発生させる。
 let available=childhoodEvents.filter(x=>!s.childhoodSeen.includes(x.title));
 if(!available.length){s.childhoodSeen=[];available=childhoodEvents}
 let item=P(available);s.childhoodSeen.push(item.title);
 return scene(item.title,item.text,item.options());
}
function civilianLevy(){
 const merchant=['小商人','商家の当主','豪商','御用商人'].includes(s.rank);
 const origin=merchant?'商いを営む町':'暮らしている村';
 return scene('領主からの軍役動員',s.local+'の領内で戦が起こり、'+origin+'にも軍役が命じられた。家臣として仕官するわけではないが、戦場での働きや兵糧の輸送を求められている。',[
  opt('臨時の兵として戦場へ出る','武勇・健康に影響／討死の危険／身分は変わらない',()=>{
   s.seen.firstBattle=true;s.lastBattleAge=s.age;
   if(risk(Math.max(4,18-Math.floor(s.stats.武勇/15)),'軍役に動員された戦場で討死した。'))return '領主の命で臨時の兵として出陣したが、敵の攻撃を受けて討死した。';
   mod('健康',-R(3,9));mod('武勇',R(1,4));
   return '臨時の兵として戦場に立ち、どうにか生還した。戦が終わると軍役を解かれ、'+(merchant?'商い':'田畑')+'に戻った。正式な家臣になったわけではない。';
  }),
  opt('兵糧や武具の運搬を引き受ける','健康－／財産＋／身分は変わらない',()=>{
   mod('健康',-R(2,6));mod('財産',R(1,4));
   return '軍勢の荷駄を運び、補給を支えた。任務を終えると'+(merchant?'商い':'田畑')+'に戻った。';
  }),
  opt('金品を納め、軍役の免除を願う','財産－／戦場には出ない',()=>{
   mod('財産',-R(5,10));return '軍役の代わりに金品を差し出し、戦場へ向かわずに済んだ。';
  })
 ]);
}
// 強制の軍役は civilianLevy に統一。志願の足軽募集とは区別する。
function recruitment(){
 if(R(1,100)<=22)return civilianLevy();
 const first=!s.seen.firstBattle;
 return scene(first?'初陣への道 ― 足軽の募集':'足軽の募集',s.local+'が兵を募っている。戦場で手柄を立てれば、武士として召し抱えられる道も開ける。',[
  opt(first?'初陣に出る':'戦場へ向かう','出陣後は指揮官から任務を命じられる',()=>{s.clan=s.clan||s.local;if(!s.rank||['百姓','商家','商人','下級武家','有力武家','浪人'].includes(s.rank))s.rank='足軽';s.pendingBattle=true;return '兵として軍勢に加わった。戦場での役割は指揮官が決める。'}),
  opt('今は家業に専念する','財産・健康を守りやすい',()=>reward('財産',2,'家業を続け、生活を守った。')),
  opt('伝手を頼って奉公口を探す','知略・魅力が高いほど有利',()=>{let p=15+Math.floor((s.stats.知略+s.stats.魅力)/4);if(R(1,100)<=p){s.clan=s.local;s.rank='足軽';return reward('財産',5,'紹介を受け、'+s.local+'に仕えることとなった。')}return '奉公先は見つからず、今は家業に戻った。'})
 ])

function decideArmyResult(rank,style,personalResult){

 let winChance=55;
 if(commander){
  if(style==='tactic')winChance+=tacticSuccess?24:tacticFailure?-27:0;

  else if(style==='guard')winChance+=3;

 }
 winChance=Math.max(12,Math.min(90,winChance));
 const victory=R(1,100)<=winChance;
 s.lastArmyResult=victory?'勝利':'敗北';
 s.armyWins=(s.armyWins||0)+(victory?1:0);
 s.armyLosses=(s.armyLosses||0)+(victory?0:1);
 let detail=victory?'【合戦結果：勝利】自軍は敵軍を退け、この戦いに勝利した。':'【合戦結果：敗北】自軍は敗れ、退却を余儀なくされた。';
 if(!victory&&commander&&s.alive){
  // 指揮官だけが敗戦責任を問われる。策略失敗なら危険が増す。

  }else if(R(1,100)<=40){

// 敵国から主人公自身への調略。断っても、さらに好条件で再訪することがある。
function foreignInvitation(){
 // 調略履歴は勧誘元の大名家ごとに管理する。再勧誘は必ず最初と同じ家から。
 if(!s.foreignInvitationHistory||typeof s.foreignInvitationHistory!=='object')s.foreignInvitationHistory={};
 const history=s.foreignInvitationHistory;
 const eligible=activeProvinces().filter(x=>x[1]!==s.clan&&(history[x[1]]||0)<2);
 const pending=s.foreignInvitationPending;
 const repeat=eligible.find(x=>x[1]===pending&&(history[x[1]]||0)===1);
 const other=repeat||P(eligible);
 if(!other)return civilian();
 const previous=history[other[1]]||0;
 const second=previous===1;
 const talents=['武勇','知略','魅力'];
 const strongest=talents.reduce((a,b)=>s.stats[b]>s.stats[a]?b:a,'武勇');
 const value=s.stats[strongest];
 const praise={
  '武勇':value>=75?'戦場にて並ぶ者なきもののふと、その武名は遠国にまで轟いております。':value>=45?'幾多の戦で勇名を馳せたもののふと伺っております。':'勇敢に戦場へ臨む武士と聞き及んでおります。',
  '知略':value>=75?'類いまれなる先見の明をお持ちで、軍略において右に出る者なしと伺っております。':value>=45?'戦の機を読む優れた知略をお持ちと伺っております。':'物事をよく見極め、思慮深く務められる方と伺っております。',
  '魅力':value>=75?'人を惹きつけるお人柄と、家臣や領民からの厚い信望は遠国にまで聞こえております。':value>=45?'人望厚く、人々の心をまとめる器量の持ち主と伺っております。':'人との縁を大切にされるお人柄と伺っております。'
 }[strongest];
 const bonus=second?R(12,20):R(5,10);
 const text=s.clan+'に仕えるあなたのもとへ、'+other[1]+'の密使がひそかに訪れた。\n\n「'+praise+'」\n\n「我が殿は、ぜひ貴殿をお迎えしたいと仰せです。'+(second?'先年、我が'+other[1]+'からの誘いをお断りになりましたが、此度は知行も役目も前より厚く取り計らいましょう。':'家臣としてお迎えし、相応の知行をお約束いたします。')+'」\n\n'+(second?'以前と同じ'+other[1]+'から、再び差し出された誘いは一段と手厚い。':'主家への忠義を守るか、新たな主君に仕えるか。決断を迫られている。');
 return scene(second?'他国からの再度の調略':'他国からの調略',text,[
  opt('誘いに応じ、'+other[1]+'へ寝返る','所属大名家が変更／家臣から再出発／財産＋'+bonus+(second?'／厚遇の約束':''),()=>{
   const old=s.clan;
   s.clan=other[1];s.rank='家臣';s.castle=null;s.independent=false;
   s.merit=second?6:3;s.trust=second?5:2;
   mod('財産',bonus);
   // 受諾した家からの勧誘は完結。ほかの家の履歴は保持する。
   history[other[1]]=2;
   s.foreignInvitationPending=null;
   s.foreignInvitationDeclines=0;
   s.foreignInvitationCooldown=s.age+R(9,15);
   if(!Array.isArray(s.achievements))s.achievements=[];
   s.achievements.push({age:s.age,year:birthYear()+s.age,kind:'転仕',summary:old+'を離れ、'+other[1]+'へ寝返って家臣として仕えた'});
   return old+'との主従を断ち、密かに'+other[1]+'へ移った。新たな主君は約束どおり家臣として召し抱え、支度金として財産'+bonus+'を与えた。'+(second?'以前より厚い待遇で迎えられた。':'')+'ただし、新参の身として家中の信頼を築き直さねばならない。';
  }),
  opt('誘いを断り、今の主君に忠義を尽くす','現在の主家に留まる／同じ家からの再勧誘は一度だけ',()=>{
   history[other[1]]=previous+1;
   s.foreignInvitationPending=second?null:other[1];
   s.foreignInvitationDeclines=0;
   s.foreignInvitationCooldown=s.age+(second?R(5,9):R(2,5));
   s.trust+=1;
   return other[1]+'の密使を退け、'+s.clan+'への忠義を貫いた。'+(second?'二度にわたる拒絶を受け、'+other[1]+'は以後の勧誘を断念した。':'しかし密使は「いつの日か、またお目にかかりましょう」と言い残して去った。');
  })
 ]);
}
function foreignInvitationChance(){
 if(!s.clan||!['家臣','重臣'].includes(s.rank)||s.age<22||s.age<(s.foreignInvitationCooldown||0))return false;
 const history=s.foreignInvitationHistory||{};
 if(!activeProvinces().some(x=>x[1]!==s.clan&&(history[x[1]]||0)<2))return false;
 const top=Math.max(s.stats.武勇,s.stats.知略,s.stats.魅力);
 const pending=s.foreignInvitationPending&&history[s.foreignInvitationPending]===1&&s.foreignInvitationPending!==s.clan;
 const chance=Math.min(16,2+Math.floor(top/14)+Math.min(3,Math.floor((s.merit||0)/12))+(pending?3:0));
 return R(1,100)<=chance;
}
function enemyRecruitment(){
 const candidates=activeProvinces().filter(x=>x[1]!==s.clan);
 const other=P(candidates),target=other[1]+'に仕える武将';
 return scene('他国武将の調略',s.clan+'の家中で、'+other[0]+'の'+target+'が主君と折り合いを欠いているとの噂が届いた。主君の許しを得て、密かに内応を探る役目を任された。',[ 
 opt('使者を送り、待遇を約束して内応を促す','知略・魅力が重要／財産－／成功すれば功績',()=>{mod('財産',-R(2,5));let chance=18+Math.floor(s.stats.知略*.4)+Math.floor(s.stats.魅力*.3);if(R(1,100)<=chance){s.merit+=2;s.trust+=4;mod('知略',R(2,4));return '密使が相手の心を動かし、'+target+'から内応の約束を取り付けた。主君から功績を認められた。'}mod('知略',R(1,2));s.trust-=1;return '返答は曖昧で、内応の約束は得られなかった。密使の費用だけが残った。'}),
 opt('相手の不満と家中の事情を探る','知略＋／慎重な情報収集',()=>{mod('知略',R(2,5));s.trust+=1;return '商人や使者の話を集め、相手の家中の不和と兵糧事情を調べて主君に報告した。'}),
 opt('金品を贈り、寝返りを働きかける','財産大幅－／成功すれば大きな功績／露見の危険',()=>{mod('財産',-R(5,10));let chance=15+Math.floor(s.stats.魅力*.35)+Math.floor(s.stats.知略*.3);if(R(1,100)<=chance){s.merit+=3;s.trust+=5;mod('魅力',R(2,4));return '贈り物と約束が功を奏し、'+target+'が味方への転身を申し出た。'}s.trust-=R(1,3);mod('魅力',-R(1,2));return '贈答の噂が漏れ、相手に警戒された。交渉は失敗に終わった。'}),
 opt('危険を避け、調略を見送る','健康は減らない／信頼が少し下がる可能性',()=>{if(R(1,100)<=35)s.trust-=1;return '相手の真意が読めず、軽々しく動かないよう主君に進言した。'})
 ]);
}

function extraScene(kind){let pool=extraEvents[kind].concat(extraEvents.common);let recent=s.recentEvents||[];let eligible=pool.filter(x=>!recent.some(y=>y.title===x[0]&&s.age-y.age<5));if(!eligible.length)eligible=pool.filter(x=>!recent.some(y=>y.title===x[0]&&s.age-y.age<2));let item=P(eligible.length?eligible:pool);return scene(item[0],item[1],item[2].map(o=>opt(o[0],o[1],()=>{let d={};for(let k in o[2])d[k]=R(o[2][k][0],o[2][k][1]);return change(d,o[3])})));}
function novelScene(factory){let recent=s.recentEvents||[];let result=factory();for(let i=0;i<8&&recent.some(y=>y.title===result.title&&s.age-y.age<4);i++){let candidate=factory();if(!recent.some(y=>y.title===candidate.title&&s.age-y.age<4)){result=candidate;break}}return result;}

 ()=>scene('大名の政務 ― 家臣への下知','重臣から領内の訴えと治安について報告が届いた。領主であるあなたが方針を決め、家臣に命じる。',[

function makeChildRecord(gender,preferred){
 const sex=gender|| (R(1,100)<=55?'男':'女');
 const pool=sex==='男'?maleNames:femaleNames;
 const used=new Set([s.name.split(' ').pop(),...(s.childRecords||[]).map(x=>x.name)]);
 const available=pool.filter(x=>!used.has(x));

function ensureChildRecords(){
 if(!Array.isArray(s.childRecords))s.childRecords=[];
 const count=Math.max(0,s.children||0);
 if(s.childRecords.length===0&&s.heirSon){
  const son=makeChildRecord('男',s.heirSon.name);
  son.born=s.heirSon.born||birthYear()+s.age-18;
  son.alive=s.heirSon.alive!==false;
  s.childRecords.push(son);
 }
 while(s.childRecords.length<count){
  const child=makeChildRecord();child.born=birthYear()+s.age-R(1,Math.min(30,Math.max(1,s.age-17)));
  s.childRecords.push(child);
 }
}
function currentHostage(){return s.hostage&&s.hostage.status==='held'?s.hostage:null;}

   !(['家臣','重臣'].includes(s.rank)||(s.rank==='大名'&&!s.independent&&s.overlord))||
   (s.trust||0)>7)return false;

function hostageRebellionWarning(){const h=currentHostage();return h?'\n\n【人質の危険】'+hostageName(h)+'は'+h.lord+'の城にいる。ここで主君への謀反に加担すれば、処刑される可能性が非常に高い。':'';}
function resolveHostageRebellion(){
 const h=currentHostage();if(!h)return '';
 // 主君への反逆時は人質が高確率で処刑される。
 if(R(1,100)<=82){
  h.status='executed';
  if(h.type==='child'){
   ensureChildRecords();const child=s.childRecords.find(x=>x.name===h.name&&x.gender===h.gender&&x.alive!==false);
   if(child)child.alive=false;
   if(s.heirSon&&s.heirSon.name===h.name)s.heirSon.alive=false;
   s.children=Math.max(0,(s.children||0)-1);
  }else if(s.spouse===h.name){s.spouse=null;s.marriageYear=null;}
  note('主君への謀反により、人質の'+hostageName(h)+'が処刑された。');
  return '\n\n【人質の悲報】主君は謀反の報せを受け、人質の'+hostageName(h)+'を処刑した。';
 }
 h.status='escaped';note('謀反の混乱に乗じて人質の'+hostageName(h)+'が城から逃れた。');
 return '\n\n【人質の行方】'+hostageName(h)+'は処刑を免れ、混乱の中で城を脱した。';
}

 if(!s||!s.clan||!['家臣','重臣'].includes(s.rank)||!s.spouse||s.successionMode||s.divorceOfferResolved||(currentHostage()&&currentHostage().type==='wife'))return false;
